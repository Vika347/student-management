 # Описывает запуск двух контейнеров и их взаимодействие

services:
  postgres:
    image: postgres:17
    container_name: student-management-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: student_management
      POSTGRES_USER: student_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_app -d student_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  payara:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-management-api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: