<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar">
    <div class="navbar__brand">
        <span class="navbar__icon">🐈</span>
        <span class="navbar__title">Студенты</span>
    </div>
</nav>

<main class="container">
    <div class="view__header"><h1>🔐 Вход</h1></div>

    <form id="login-form" style="max-width:400px; margin:0 auto;" novalidate>
        <div class="form-grid">
            <div class="form-group form-group--full">
                <label for="login-username">Логин</label>
                <input type="text" id="login-username" required autofocus autocomplete="username" />
            </div>
            <div class="form-group form-group--full">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" required autocomplete="current-password" />
            </div>
        </div>
        <div class="form-error" id="login-error" style="margin-bottom:1rem;"></div>
        <div class="form-actions">
            <button type="submit" class="btn btn--primary">Войти</button>
            <a href="register.html" class="btn btn--secondary">Регистрация</a>
        </div>
    </form>
</main>

<script src="js/auth.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
