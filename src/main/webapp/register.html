<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar">
    <div class="navbar__brand">
        <span class="navbar__icon">🐈</span>
        <span class="navbar__title">Студенты</span>
    </div>
</nav>

<main class="container">
    <div class="view__header"><h1>📝 Регистрация</h1></div>

    <form id="register-form" style="max-width:400px; margin:0 auto;" novalidate>
        <div class="form-grid">
            <div class="form-group form-group--full">
                <label for="reg-username">Логин (3–50 симв.)</label>
                <input type="text" id="reg-username" required minlength="3" maxlength="50" autocomplete="username" />
            </div>
            <div class="form-group form-group--full">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" required autocomplete="email" />
            </div>
            <div class="form-group form-group--full">
                <label for="reg-password">Пароль (мин. 8 симв.)</label>
                <input type="password" id="reg-password" required minlength="8" autocomplete="new-password" />
            </div>
        </div>
        <div class="form-error" id="register-error" style="margin-bottom:1rem;"></div>
        <div class="form-actions">
            <button type="submit" class="btn btn--primary">Создать аккаунт</button>
            <a href="login.html" class="btn btn--secondary">← Ко входу</a>
        </div>
    </form>
</main>

<script src="js/auth.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
